name: Discover and enrich three-month Nasdaq history
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'YYYY-MM-DD; defaults to today and processes the prior three completed months'
        required: false
        type: string
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover official release candidates
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          if [ -n "$AS_OF" ]; then node scripts/discover-history.mjs "--as-of=$AS_OF"; else node scripts/discover-history.mjs; fi
      - name: Compute exact QQQ NVDA SMH windows
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          test -n "$MASSIVE_API_KEY" || { echo 'Add MASSIVE_API_KEY to NasCal repository Actions secrets'; exit 1; }
          if [ -n "$AS_OF" ]; then node scripts/enrich-history-reactions.mjs "--as-of=$AS_OF"; else node scripts/enrich-history-reactions.mjs; fi
      - name: Validate history
        run: node scripts/validate-history.mjs
      - name: Commit verified history and discovery queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/event-results.json history/discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill verified historical market reactions"
            git push
          fi
