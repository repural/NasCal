name: Refresh Nasdaq calendar
on:
  schedule:
    - cron: '0 4 * * *' # Daily, 07:00 Europe/Istanbul
    - cron: '0 5 1 * *' # Monthly, first day at 08:00 Europe/Istanbul
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh scope
        type: choice
        options: [daily, monthly]
        default: daily
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-calendar.yml'
      - 'scripts/*calendar*.mjs'
      - 'tests/*calendar*.test.mjs'
permissions:
  contents: write
concurrency:
  group: nascal-calendar-refresh
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/calendar-refresh.test.mjs tests/official-calendar-collector.test.mjs
      - run: node scripts/refresh-calendar.mjs --mode=validate
  refresh:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect official calendars and announcements (no AI API)
        env:
          REFRESH_MODE: ${{ inputs.mode || (github.event.schedule == '0 5 1 * *' && 'monthly') || (github.event_name == 'push' && 'monthly') || 'daily' }}
        run: node scripts/refresh-calendar.mjs --mode="$REFRESH_MODE"
      - name: Validate resulting calendar
        run: node scripts/refresh-calendar.mjs --mode=validate
      - name: Store source review report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/calendar-refresh/
          if git diff --cached --quiet; then
            echo 'No meaningful changes to publish.'
            exit 0
          fi
          git commit -m 'Collect official Nasdaq calendar sources for research review'
          # Rebase onto concurrent historical-data commits. Conflicts fail safely;
          # never force-push or discard another writer's data.
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nascal-calendar-export
          path: exports/Nasdaq-Event-Calendar-2026.html
          retention-days: 30
