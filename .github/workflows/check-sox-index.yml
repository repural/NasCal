name: Check SOX index availability
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-sox-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check SOX reference and historical bars
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.MASSIVE_API_KEY;
          if (!key) { console.log('MASSIVE_API_KEY: not configured'); process.exitCode = 1; return; }
          async function check(label, path) {
            try {
              const url = new URL('https://api.massive.com' + path);
              url.searchParams.set('apiKey', key);
              const response = await fetch(url);
              const data = await response.json();
              console.log(JSON.stringify({
                check: label,
                httpStatus: response.status,
                apiStatus: data.status ?? null,
                error: data.error ?? data.message ?? null,
                ticker: data.results?.ticker ?? data.results?.[0]?.ticker ?? null,
                name: data.results?.name ?? data.results?.[0]?.name ?? null,
                market: data.results?.market ?? data.results?.[0]?.market ?? null,
                resultsCount: data.resultsCount ?? (Array.isArray(data.results) ? data.results.length : null),
                sample: Array.isArray(data.results) && data.results.length
                  ? { date: new Date(data.results.at(-1).t).toISOString().slice(0, 10), close: data.results.at(-1).c }
                  : null
              }));
            } catch (error) {
              console.log(JSON.stringify({ check: label, error: error.message }));
              process.exitCode = 1;
            }
          }
          await check('reference', '/v3/reference/tickers/I:SOX');
          await check('daily', '/v2/aggs/ticker/I:SOX/range/1/day/2026-09-21/2026-09-24?limit=10');
          await check('minute', '/v2/aggs/ticker/I:SOX/range/1/minute/2026-09-24/2026-09-24?limit=1000');
          NODE
