name: Check Nasdaq index value access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-nasdaq-index.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Nasdaq index values with repository secret
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.MASSIVE_API_KEY;
          if (!key) process.exit(1);
          const symbols = ['I:COMP', 'I:NDX', 'I:IXIC'];
          async function query(symbol, kind, path) {
            const url = new URL('https://api.massive.com' + path);
            url.searchParams.set('apiKey', key);
            try {
              const response = await fetch(url);
              const data = await response.json();
              const bars = Array.isArray(data.results) ? data.results : [];
              console.log(JSON.stringify({
                symbol, kind, http: response.status, status: data.status ?? null,
                error: data.error ?? data.message ?? null,
                ticker: data.results?.ticker ?? data.ticker ?? null,
                name: data.results?.name ?? null, count: data.resultsCount ?? bars.length,
                last: bars.length ? { et: new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',dateStyle:'short',timeStyle:'short'}).format(bars.at(-1).t), close: bars.at(-1).c } : null
              }));
            } catch (error) {
              console.log(JSON.stringify({symbol,kind,error:error.message}));
              process.exitCode = 1;
            }
          }
          for (const symbol of symbols) {
            await query(symbol, 'reference', '/v3/reference/tickers/' + symbol);
            await query(symbol, 'daily', '/v2/aggs/ticker/' + symbol + '/range/1/day/2026-09-22/2026-09-24?limit=10');
            await query(symbol, 'minute', '/v2/aggs/ticker/' + symbol + '/range/1/minute/2026-09-23/2026-09-23?limit=1000');
          }
          NODE
