name: Backfill historical event-to-close reactions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-close-reactions.yml'
  workflow_dispatch:
    inputs:
      month:
        description: 'Archived month in YYYY-MM format'
        required: true
        type: string
      ticker:
        description: 'Ticker (default NVDA)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  close-reactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record event-to-close reactions
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MONTH: ${{ inputs.month }}
          TICKER: ${{ inputs.ticker }}
        run: |
          test -n "$MASSIVE_API_KEY" || { echo 'MASSIVE_API_KEY is not configured in NasCal'; exit 1; }
          node scripts/enrich-history-close-reactions.mjs "--month=${MONTH:-2026-08}" "--ticker=${TICKER:-NVDA}"
      - name: Validate archive
        run: node scripts/validate-history.mjs
      - name: Save close reactions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/event-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Record historical event-to-close reactions"
            git push
          fi
